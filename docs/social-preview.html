<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; }
  body {
    background:#0E1116;
    color:#F4F6F8;
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    padding:0 76px 44px 116px;
    display:flex; flex-direction:column;
    position:relative;
    -webkit-font-smoothing:antialiased;
  }
  /* collee au bord, le texte demarre 108px plus loin */
  .rule { position:absolute; left:0; top:0; width:8px; height:640px; background:#F0A030; }

  .content { flex:1; display:flex; flex-direction:column; justify-content:center; padding-top:12px; }

  .kicker {
    font-family:Consolas,"Cascadia Mono",monospace;
    font-size:18px; letter-spacing:.26em; text-transform:uppercase; color:#F0A030;
  }
  h1 {
    font-size:70px; line-height:1.16; font-weight:700; letter-spacing:-.028em; margin-top:26px;
  }
  h1 .c { font-family:Consolas,"Cascadia Mono",monospace; font-size:61px;
          font-weight:400; color:#F0A030; letter-spacing:-.015em; }
  .red { display:block; font-size:47px; line-height:1.2; color:#FF7A6B;
         font-weight:600; margin-top:16px; letter-spacing:-.015em; }
  .sub { font-size:27px; line-height:1.45; color:#9AA5B4; margin-top:26px; max-width:920px; }

  .foot { display:flex; justify-content:space-between; align-items:baseline;
          border-top:1px solid #232A35; padding-top:22px; }
  .name { font-size:25px; font-weight:700; letter-spacing:.01em; white-space:nowrap; }
  .name .o { color:#F0A030; }
  .name .d { font-weight:400; color:#9AA5B4; }
  .cmd { font-family:Consolas,"Cascadia Mono",monospace; font-size:20px;
         color:#C6CEDA; white-space:nowrap; }
  .cmd b { color:#F0A030; font-weight:400; }
</style>
</head>
<body>
  <div class="rule"></div>
  <div class="content">
    <div class="kicker">audit &mdash; context file</div>
    <h1>Your <span class="c">AGENTS.md</span> says <span class="c">npm run test</span>.</h1>
    <span class="red">The repo deleted that script six months ago.</span>
    <div class="sub">Project Oracle checks every rule against the repository &mdash;
      which it backs, which it contradicts, which nobody can verify.</div>
  </div>
  <div class="foot">
    <div class="name">PROJECT <span class="o">ORACLE</span> <span class="d">&middot; zero dependencies</span></div>
    <div class="cmd"><b>$</b> pipx install project-oracle</div>
  </div>
</body>
</html>
